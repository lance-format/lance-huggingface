[project]
name = "lance-hf-common"
version = "0.1.0"
description = "Shared helpers for converting standard datasets to Lance format on the Hugging Face Hub"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "pylance",
    "lancedb",
    "pyarrow",
    "datasets",
    "huggingface_hub",
    "numpy",
    "pillow",
    "torch",
    "open_clip_torch",
    "sentence-transformers",
]
